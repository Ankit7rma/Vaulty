name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders so lint/typecheck/build don't fail on missing
      # env. No real database is touched in this job.
      DATABASE_URL: postgresql://user:pass@localhost:5432/vaulty
      JWT_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vaulty:vaulty@localhost:5432/vaulty
      JWT_SECRET: ci-e2e-placeholder-not-a-real-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulty
          POSTGRES_PASSWORD: vaulty
          POSTGRES_DB: vaulty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulty -d vaulty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npm run db:deploy

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e
